[project]
name = "recsys"
version = "0.1.0"
description = "Multimodal Recommender System built during HSE AI Msc 2026"
readme = "README.md"
authors = [
    { name = "Lev Khoriak", email = "lev.horyak@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
train = [
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true