[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mm-recsys"
version = "0.1.0"
description = "Мультимодальная рекомендательная система на Amazon Reviews 2023"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
train = [
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mm_recsys"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]