[project]
name = "recsys"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lev Khoriak", email = "lev.horyak@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.106",
    "fsspec>=2026.9.0",
    "huggingface-hub>=2.2.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "s3fs[boto3]>=2025.1",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
train = [
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-boto3[s3]>=1.43.114",
    "types-tqdm>=4.70.0.20260906",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[tool.pyrefly]
python-interpreter-path = '.venv/bin/python'
project-includes = ["src", "tests", "notebooks"]
search-path = ["src"]
